# ==============================================================================
# MedSafe Fly.io Deployment Configuration
# Includes persistent volume mount for SQLite retention
# ==============================================================================
app = "medsafe-flask-backend"
primary_region = "iad"

[build]
  dockerfile = "flask_backend/Dockerfile"

[env]
  PORT = "5000"
  FLASK_ENV = "production"
  MEDSAFE_DB_PATH = "/app/data/medsafe.db"
  RAZORPAY_MODE = "TEST"
  RAZORPAY_AUTO_CAPTURE = "true"

[mounts]
  source = "medsafe_data"
  destination = "/app/data"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
